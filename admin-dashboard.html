<!--Admin dashboard-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Sweetie Dashboard">
        <meta name="author" content="Ivy Tran">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sweetie Dashboard</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap"
            rel="stylesheet">

        <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

        <!-- Font Awesome Icon -->
        <script src="https://kit.fontawesome.com/a927491084.js" crossorigin="anonymous"></script>
        
        <!-- CSS -->
        <link rel="Stylesheet" href="css/admin-dashboard-style.css" >
        <link rel="stylesheet" href="lib/datatables/css/dataTables.css" />
        <link rel="stylesheet" href="css/modal-style.css" />
        <link rel="stylesheet" href="css/button-style.css" />
        <link rel="stylesheet" href="css/toggle-style.css" />
        <link rel="stylesheet" href="css/tooltip-style.css" />
        <link rel="stylesheet" href="css/text-style.css" />
        <link rel="stylesheet" href="css/icons-style.css" />
        <link rel="stylesheet" href="css/form-style.css" />
        <link rel="stylesheet" href="css/datatable-style.css" />
        <link rel="stylesheet" href="css/list-style.css" />
    </head>
    <body>
        <dialog>
            <div id="modal-header" class="title-container modal-title">
                <h4 id="modal-header-text" ></h4>
            </div>
            <div id="modal-content"></div>
            <div id="modal-footer"></div>
        </dialog>
        <nav>
            <div class="header">
                <h1 id="dashboard-name">Sweetie Nails Admin Dashboard</h1>
                <div class="clock">
                    <i class="fa-solid fa-clock"></i>
                    <time datetime="2026-01-20T19:30">20/01/2026, 19:30:00</time>
                </div>
            </div>
            <hr>
                <ul>
                    <li id="bills" class="tab-link active"><i class="fa-solid fa-file-invoice-dollar"></i><span>Bills</span></li>
                    <li id="vouchers" class="tab-link"><i class="fa-solid fa-gift"></i><span>Vouchers</span></li>
                    <li id="income" class="tab-link"><i class="fa-solid fa-money-check-dollar"></i><span>Income</span></li>
                    <li id="performance" class="tab-link"><i class="fa-solid fa-chart-simple"></i></i><span>Insights</span></li>
                    <li id="staff" class="tab-link"><i class="fa-solid fa-user"></i><span>Staff</span></span></li>
                    <li id="services" class="tab-link"><i class="fa-solid fa-hand-holding-heart"></i><span>Services</span></li>
                    <li id="branches" class="tab-link"><i class="fa-solid fa-code-branch"></i><span>Branches</span></li>
                </ul>
        </nav>
        <main>
            
            
        </main>
        
        <!--jquery // This will be removed-->
        <script type="text/javascript" src="lib/jquery/jquery-3.7.1.min.js"></script>

        <!--dataTables // This will be removed and replaced by vanila js table-->
        <script type="text/javascript" src="lib/datatables/js/dataTables.js"></script>
        
        <!--dashboard-controller-->
        <script type="module" src="js/dashboard-branches.js"></script>
        <script type="module" src="js/dashboard-services.js"></script>
        <script type="module" src="js/dashboard-vouchers.js"></script>
        <script type="module" src="js/dashboard-staff.js"></script>
        <script type="module" src="js/dashboard-bills.js"></script>

        <script type="text/javascript">
            function resizeMainElement(){
                const navElem = document.querySelector("nav");
                const mainElem = document.querySelector("main");
                mainElem.style.height = (window.innerHeight - navElem.scrollHeight) + "px";
            }
            
            resizeMainElement();
            window.addEventListener('resize', resizeMainElement);

            //switch a tab to be active when being clicked
            function showTab(tabName) {
                const tabLinks = document.querySelectorAll('.tab-link');
                for (let i = 0; i < tabLinks.length; i++) {
                    //when a tab is clicked, set all classnames to 'inactive'
                    tabLinks[i].className = tabLinks[i].className.replace(" active", "");
                }

                //set the selected tab to 'active'
                document.getElementById(tabName).className += " active";
            }

            const navLinks = document.querySelectorAll('.tab-link');
            for (let link of navLinks){
                const linkId = link.getAttribute('id');
                link.addEventListener('click', ()=> showTab(linkId))
            }
        </script>
    </body>
</html>
