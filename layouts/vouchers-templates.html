<template id="voucher-input-template">
  <div class="title-container">
    <h2 class="col-title"></h2>
  </div>
  <div class="main-func-btns">
    <button id="edit-btn" class="round-btn edit-btn">
      <i class="fa-solid fa-pen-to-square fa-lg"></i>
      <span class="tooltiptext">Edit</span>
    </button>
    <button id="delete-btn" class="round-btn delete-btn">
      <i class="fa-solid fa-trash fa-lg"></i>
      <span class="tooltiptext">Delete</span>
    </button>
    <button class="round-btn close-btn" id="close-btn">
      <i class="fa-solid fa-xmark fa-xl"></i>
      <span class="tooltiptext">Close</span>
    </button>
  </div>
  <form class="form">
    <div class="text-input-container">
      <label class="form-label" for="buyer">What is the buyer name?</label
      ><br />
      <input
        class="form-input"
        maxlength="20"
        type="text"
        id="buyer"
        name="buyer"
        disabled
        required
        value=""
      />
    </div>
    <div class="double-inputs">
      <div class="text-input-container half">
        <label class="form-label" for="originalValueCents"
          >Voucher original value:</label
        ><br />
        <input
          class="form-input"
          type="text"
          id="originalValueCents"
          name="originalValueCents"
          disabled
          required
          value=""
        />
      </div>
      <div class="text-input-container half">
        <label class="form-label" for="remainingValueCents"
          >Voucher remaining value:</label
        ><br />
        <p
          class="form-value-text"
          name="remainingValueCents"
          id="remainingValueCents"
        ></p>
      </div>
    </div>
    <div class="double-inputs">
      <div class="text-input-container half">
        <label class="form-label" for="issueDate">Date of issue:</label><br />
        <p class="form-value-text" name="issueDate" id="issueDate"></p>
      </div>
      <div class="text-input-container half">
        <label class="form-label" for="expiryDate">Expired date:</label><br />
        <p class="form-value-text" name="expiryDate" id="expiryDate"></p>
      </div>
    </div>
    <div class="double-inputs">
      <div class="toggle-container">
        <label class="form-label" for="status">Status:</label><br />
        <div name="status" id="status" class="toggle">
          <div class="toggle-btn active" id="toggle-active">Valid</div>
          <div class="toggle-btn" id="toggle-inactive">Used</div>
          <div class="toggle-btn" id="toggle-warning">Expired</div>
        </div>
      </div>
      <div class="text-input-container half">
        <label class="form-label" for="mobile">Buyer's mobile:</label><br />
        <input
          class="form-input"
          maxlength="10"
          type="text"
          id="mobile"
          name="mobile"
          disabled
          required
          value=""
        />
      </div>
    </div>
    <div class="text-input-container">
      <label class="form-label" for="note">Notes:</label><br />
      <input
        class="form-input"
        maxlength="50"
        type="text"
        id="note"
        name="note"
        disabled
        required
        value=""
      />
    </div>
    <div class="confirm-btns">
      <button type="submit" id="confirm-btn" class="square-btn confirm-btn">
        Confirm
      </button>
      <button id="cancel-btn" class="square-btn cancel-btn">Cancel</button>
    </div>
  </form>
</template>
